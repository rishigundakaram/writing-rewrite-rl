# Clean-split 400-step runs with win-rate-vs-GPT-5.6 online evaluation.
model = "meta-llama/Llama-3.2-3B-Instruct"
max_steps = 400
batch_size = 64
rollouts_per_example = 8

[sampling]
max_tokens = 700

[val]
interval = 20
num_examples = 32

[eval]
interval = 40

[[eval.env]]
id = "rishigundakaram/writing-rewrite"
args = { task = "winrate" }
num_examples = 64
rollouts_per_example = 1

[adapters]
interval = 40
keep_last = -1

[[env]]
id = "rishigundakaram/writing-rewrite"
